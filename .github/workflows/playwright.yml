name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Cache node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npm run pw:install

    - name: Run Playwright tests (pull_request - github reporter)
      if: ${{ github.event_name == 'pull_request' }}
      run: npm run test:ci -- --reporter=github,html

    - name: Run Playwright tests (main - html reporter)
      if: ${{ github.ref == 'refs/heads/main' }}
      run: npm run test:ci -- --reporter=html

    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Deploy Playwright report to gh-pages
      if: ${{ github.ref == 'refs/heads/main' && always() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
        publish_branch: gh-pages
        allow_empty_commit: true

    - name: Add report link to job summary
      if: ${{ github.ref == 'refs/heads/main' && always() }}
      run: |
        echo "Playwright HTML report published: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
